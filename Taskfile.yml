version: '3'

vars:
  CORPUS: '{{default "gritty" .RTTY_CORPUS_SET}}'

includes:
  version: ./Taskfile.version.yml

tasks:
  default:
    desc: List available tasks.
    cmds:
      - task --list

  test:
    desc: Run the Go suite (protocol, receiver experiment, and reference artifacts).
    cmds:
      - go test ./...

  test:purego:
    desc: Run the suite with CGO disabled.
    env:
      CGO_ENABLED: '0'
    cmds:
      - go test ./...

  test:smoke:
    desc: Run the small, offline protocol and foundation suite.
    cmds:
      - task: test

  test:smoke-purego:
    desc: Run the offline protocol and foundation suite with CGO disabled.
    cmds:
      - task: test:purego

  test:race:
    desc: Run the Go race detector (requires a supported CGO toolchain).
    cmds:
      - go test -race ./...

  vet:
    desc: Run go vet.
    cmds:
      - go vet ./...

  reference:minimodem:
    desc: Reproduce the checked-in fixtures and decode them with pinned minimodem.
    requires:
      vars: [RTTY_MINIMODEM]
    cmds:
      - python3 scripts/reference.py verify-minimodem

  reference:fldigi:
    desc: Replay fixtures in pinned fldigi using an isolated Xvfb display (Linux).
    requires:
      vars: [RTTY_FLDIGI, RTTY_XVFB]
    cmds:
      - python3 scripts/fldigi-replay.py

  test:oracle:
    desc: Run both external reference checks; requires pinned tools and Xvfb.
    cmds:
      - task: reference:minimodem
      - task: reference:fldigi

  corpus:fetch:
    desc: Download pinned external recordings (RTTY_CORPUS_SET=gritty or w6iwi).
    requires:
      vars: [RTTY_CORPUS]
    cmds:
      - python3 scripts/corpus.py fetch --corpus '{{.CORPUS}}'

  corpus:prepare:
    desc: Reproduce pinned 12/48 kHz derivatives offline with pinned libsamplerate.
    requires:
      vars: [RTTY_CORPUS, RTTY_SAMPLERATE]
    cmds:
      - python3 scripts/corpus.py prepare --corpus '{{.CORPUS}}'

  corpus:verify:
    desc: Verify all external originals and derivatives offline; missing files fail.
    requires:
      vars: [RTTY_CORPUS]
    cmds:
      - python3 scripts/corpus.py verify --corpus '{{.CORPUS}}'

  corpus:replay:
    desc: Capture unscored corpus output in fldigi at 12 kHz with both USOS policies.
    requires:
      vars: [RTTY_CORPUS, RTTY_FLDIGI, RTTY_XVFB]
    cmds:
      - python3 scripts/corpus.py replay --corpus '{{.CORPUS}}'

  corpus:minimodem:
    desc: Capture unscored corpus text and raw codes with pinned minimodem at 12 kHz.
    requires:
      vars: [RTTY_CORPUS, RTTY_MINIMODEM]
    cmds:
      - python3 scripts/corpus.py minimodem --corpus '{{.CORPUS}}'

  corpus:check:
    desc: Offline corpus-tool tests; resampler qualification runs only when configured.
    cmds:
      - python3 -B -m unittest discover -s scripts -p '*_test.py'

  receiver:baseline:
    desc: Report the internal receiver's checked-in independent clean-fixture results.
    cmds:
      - go test ./internal/receiver -run '^TestIndependentBaseline$' -v -count=1

  receiver:impairments:
    desc: Reproduce the current receiver's development impairment study and regression comparison.
    cmds:
      - go test ./internal/receiver -run '^TestChannelStudy$' -v -count=1

  receiver:impairments:legacy:
    desc: Reproduce the original rectangular receiver's retained development baseline.
    cmds:
      - go test ./internal/receiver -run '^TestChannelStudy$' -v -count=1 -args -receiver-study-legacy

  receiver:selective:
    desc: Reproduce the test-only unequal-tone threshold comparison, including regressions.
    cmds:
      - go test ./internal/receiver -run '^TestSelectiveStudy$' -v -count=1

  receiver:noise:
    desc: Reproduce guarded-envelope and short-evidence development comparisons.
    cmds:
      - go test ./internal/receiver -run '^TestNoise(AwareStudy|ShortEvidenceStudy)$' -v -count=1

  bench:noise:
    desc: Benchmark noise-aware test prototypes including shared replay overhead.
    cmds:
      - go test ./internal/receiver -run '^$' -bench '^BenchmarkNoise(AwareCandidates|ShortEvidence)$' -benchmem

  bench:thresholds:
    desc: Benchmark threshold candidates including the shared experimental replay harness.
    cmds:
      - go test ./internal/receiver -run '^$' -bench '^BenchmarkThresholdCandidates$' -benchmem

  bench:receiver:
    desc: Benchmark the experimental receiver on clean audio with 20 ms chunks.
    cmds:
      - go test ./internal/receiver -run '^$' -bench '^BenchmarkReceiver$' -benchmem -count=3

  check:
    desc: Run local protocol and foundation checks; this is not a modem release gate.
    cmds:
      - task: version:check
      - task: test
      - task: test:purego
      - task: corpus:check
      - task: vet
      - task: test:race
